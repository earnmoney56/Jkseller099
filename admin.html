<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Product Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div id="login-box" class="fixed inset-0 bg-gray-900 bg-opacity-90 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md mx-4">
            <div class="text-center mb-6">
                <i class="fa-solid fa-lock text-4xl text-orange-500 mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800">Admin Portal</h2>
                <p class="text-sm text-gray-500">Enter password to manage products</p>
            </div>
            <input type="password" id="admin-pass" placeholder="Enter Secure Password" class="w-full p-3 border rounded-lg mb-4 outline-none focus:ring-2 focus:ring-orange-500">
            <button onclick="checkPassword()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition">Login Dashboard</button>
        </div>
    </div>

    <div id="dashboard-content" class="hidden min-h-screen flex flex-col">
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fa-solid fa-gauge-high text-orange-500"></i> Jkseller09 Control Panel
            </h1>
            <button onclick="location.reload()" class="text-sm text-red-500 hover:underline font-semibold">Logout</button>
        </header>

        <div class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 w-full flex-1">
            <div class="bg-white p-5 rounded-xl shadow-sm border h-fit space-y-4">
                <h2 class="text-lg font-bold text-gray-700 border-b pb-2"><i class="fa-solid fa-plus-circle text-green-500 mr-1"></i> Add New Product</h2>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Product Title</label>
                    <input type="text" id="p-name" placeholder="e.g., Wireless Bluetooth Earbuds" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-orange-500" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Price (Rs.)</label>
                    <input type="number" id="p-price" placeholder="e.g., 2499" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-orange-500" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Product Image</label>
                    <input type="file" id="p-image" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100 cursor-pointer" required>
                </div>

                <button id="upload-btn" onclick="uploadProduct()" class="w-full bg-gradient-to-r from-orange-500 to-red-600 text-white font-bold py-3 rounded-lg shadow-md hover:opacity-95 transition tracking-wide flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Upload Product
                </button>
                <p id="upload-status" class="text-xs text-center font-semibold text-gray-500 mt-2 hidden">Uploading item and saving to database...</p>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border lg:col-span-2 flex flex-col">
                <h2 class="text-lg font-bold text-gray-700 border-b pb-2 mb-4"><i class="fa-solid fa-boxes-stacked text-orange-500 mr-1"></i> Live Products on Website</h2>
                <div id="admin-products-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4 overflow-y-auto max-h-[600px] flex-1">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script src="admin.js"></script>
</body>
</html>
